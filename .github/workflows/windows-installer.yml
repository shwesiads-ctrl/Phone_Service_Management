name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'build/**'
      - 'electron-main.cjs'
      - 'desktop-close-confirmation.cjs'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build application
        run: |
          npm run lint
          npm run build
          npm run desktop:build-server
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FixFlow-Windows-Installer-${{ github.sha }}
          path: release/FixFlow-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
