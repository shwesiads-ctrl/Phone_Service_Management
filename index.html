<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixFlow Repair & Service Manager</title>
    <meta name="description" content="Clean, modern device repair and workshop management system with multilingual support, multi-currency accounting, and dark mode." />
    <meta property="og:title" content="FixFlow Repair & Service Manager" />
    <meta property="og:description" content="Clean, modern device repair and workshop management system with multilingual support, multi-currency accounting, and dark mode." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Anti-flash script for immediate Dark Mode / System theme resolution before render -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('fixflow_theme');
          const storedTheme = ['light','dark','system'].includes(savedTheme) ? savedTheme : 'system';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
